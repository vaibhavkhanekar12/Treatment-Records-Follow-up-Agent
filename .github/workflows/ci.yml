name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master]

jobs:
  static-checks:
    name: Lint, LWC tests, Apex static analysis, metadata conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Prettier (also parses every Apex class)
        run: npx prettier --check "force-app/**/*.{cls,js,html,css}" "agentforce/**/*.cls"
      - name: ESLint (LWC)
        run: npm run lint
      - name: LWC Jest
        run: npm run test:unit
      - name: Install Salesforce CLI + Code Analyzer
        run: |
          npm install -g @salesforce/cli
          sf plugins install @salesforce/plugin-code-analyzer
      - name: Metadata conversion (all package directories)
        run: |
          for d in prerequisites force-app analytics agentforce; do
            sf project convert source --root-dir "$d" --output-dir "mdapi/$d"
          done
      - name: PMD (fail on High severity)
        run: sf code-analyzer run --workspace force-app --workspace agentforce --rule-selector pmd:Recommended --rule-selector pmd:Security --severity-threshold 2

  validate-deploy:
    name: Validate deployment + run Apex tests (needs SF_AUTH_URL secret)
    runs-on: ubuntu-latest
    needs: static-checks
    env:
      SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SF_AUTH_URL != ''
      - name: Validate against target org
        if: env.SF_AUTH_URL != ''
        run: |
          npm install -g @salesforce/cli
          echo "$SF_AUTH_URL" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias target
          rm auth.txt
          sf project deploy validate --source-dir force-app --target-org target --test-level RunLocalTests --wait 60
      - name: Skip notice
        if: env.SF_AUTH_URL == ''
        run: echo "SF_AUTH_URL secret not configured - org validation skipped."
